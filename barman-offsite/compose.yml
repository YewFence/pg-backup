name: barman-offsite

services:
  barman-offsite:
    image: ${BARMAN_IMAGE:-ghcr.io/yewfence/pg-backup/barman:latest}
    container_name: ${BARMAN_CONTAINER_NAME:-barman-offsite}
    init: true
    restart: unless-stopped
    environment:
      HEALTH_CHECK_PORT: ${HEALTH_CHECK_PORT:-8000}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-300}
      FAIL_THRESHOLD: ${FAIL_THRESHOLD:-3}
      BARMAN_UID: ${BARMAN_UID:-1000}
      BARMAN_GID: ${BARMAN_GID:-1000}
      BARMAN_FIX_OWNERSHIP: ${BARMAN_FIX_OWNERSHIP:-true}
    volumes:
      - ${BARMAN_VOLUME:-barman-offsite-data}:/var/lib/barman
      - ./config:/etc/barman.d:ro
      - type: bind
        source: ${POSTGRES_RESTORE_ROOT:-/srv/native-docker/postgres-restore}
        target: /restore
        bind:
          create_host_path: false
    ports:
      - "${HEALTH_CHECK_HOST:-127.0.0.1}:${HEALTH_CHECK_PORT:-8000}:${HEALTH_CHECK_PORT:-8000}"
    networks:
      - barman-offsite-net

networks:
  barman-offsite-net:
    driver: bridge

volumes:
  barman-offsite-data:
