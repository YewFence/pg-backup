# TYPE  DATABASE        USER            ADDRESS          METHOD

# 容器内 unix socket 使用 peer 认证，postgres 系统用户可以直接管理实例。
local   all             all                              peer

# 本机访问使用 SCRAM 密码认证。
host    all             all             127.0.0.1/32     scram-sha-256
host    all             all             ::1/128          scram-sha-256

# Tailscale 网段，便于边缘节点之间通过私有网络访问。
host    all             all             100.64.0.0/10    scram-sha-256

# Docker 内网，供加入 pg-net 的业务容器连接 PostgreSQL。
host    all             all             172.16.0.0/12    scram-sha-256

# replication 用户用于流复制和备份工具。
local   replication     all                              peer
host    replication     all             127.0.0.1/32     scram-sha-256
host    replication     all             ::1/128          scram-sha-256
host    replication     all             100.64.0.0/10    scram-sha-256
host    replication     all             172.16.0.0/12    scram-sha-256
